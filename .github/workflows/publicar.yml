# Publicação: a cada merge na main, aplica as migrations no Supabase da nuvem
# e publica o site no GitHub Pages. Também pode ser disparado à mão na aba Actions.
#
# Segredos usados (Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN  token pessoal do Supabase (Account > Access Tokens)
#   SUPABASE_DB_PASSWORD   senha do banco do projeto orbita
name: Publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publicar
  cancel-in-progress: false

env:
  SUPABASE_CLI: supabase@3.2.0
  # Identificador do projeto orbita no Supabase (não é segredo).
  SUPABASE_PROJECT_REF: zunusztfzmsaeinxsjjc

jobs:
  migrations:
    name: Migrations no Supabase
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Conferir os segredos
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Faltam os segredos SUPABASE_ACCESS_TOKEN e/ou SUPABASE_DB_PASSWORD no repositório."
            exit 1
          fi
      - name: Ligar ao projeto
        run: npx --yes $SUPABASE_CLI link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Aplicar as migrations novas
        # --remote: sem ele, o CLI 3 aplica no banco local, não no projeto ligado.
        # --yes: a CI não tem terminal para confirmar; o merge na main já é a aprovação.
        run: npx --yes $SUPABASE_CLI db push --remote --yes --password "$SUPABASE_DB_PASSWORD"

  site:
    name: Site no GitHub Pages
    needs: migrations
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Usa web/.env.production: URL e chave PÚBLICA do projeto orbita.
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: publicacao
        uses: actions/deploy-pages@v4
